<!doctype html>
<html lang="nb">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Uten nett – TrappApp</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #f6f7f6;
        --fg: #14201b;
        --muted: #5d6b64;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0c110f;
          --fg: #e8efea;
          --muted: #96a69d;
        }
      }
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 24px;
        background: var(--bg);
        color: var(--fg);
        font-family: system-ui, -apple-system, sans-serif;
        text-align: center;
      }
      h1 {
        font-size: 1.5rem;
        margin: 0 0 8px;
      }
      p {
        color: var(--muted);
        margin: 0 0 20px;
        max-width: 32ch;
      }
      button {
        border: 0;
        border-radius: 16px;
        background: #059669;
        color: #fff;
        font: inherit;
        font-weight: 600;
        padding: 14px 24px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Du er uten nett</h1>
      <p>
        TrappApp trenger nettforbindelse for å registrere turen. Prøv igjen når
        du har dekning.
      </p>
      <button type="button" onclick="location.reload()">Prøv igjen</button>
    </main>
  </body>
</html>
